name: draw # This will become the name of your environment
dependencies: # The list of packages to include in your environment
    - python=3.13 # You can specify versions
    - pip # Install pip in your environment
    - pip: # Include pip dependencies last
        - --extra-index-url https://download.pytorch.org/whl/cu126
        - awscli
        - alembic==1.13.1
        - click==8.1.7
        - dcmrtstruct2nii==5
        - nnunetv2>=2.8.1
        - nibabel==5.4.2
        - numpy==2.5.2
        - pandas==3.0.5
        - pydicom==2.4.3
        - PyYAML>=6.0.1
        - retry==0.9.2
        - rt-utils==1.2.7
        - schema==0.7.5
        - simpleitk==2.5.6
        - sqlalchemy>=2.0.36
        # CUDA 12.6 builds (compatible with AWS Batch g4dn T4 GPUs)
        - torch
        - torchaudio
        - torchvision
        - setuptools>=65.0
        - watchdog==6.0.0
